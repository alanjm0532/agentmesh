[server]
addr = "127.0.0.1:8080"
mode = "debug"
# Enable HTTPS in production; this switch is independent of mode.
https_enabled = false
# Required when HTTPS is enabled. Paths refer to files inside the container.
tls_cert_file = "/app/certs/fullchain.pem"
tls_key_file = "/app/certs/privkey.pem"
# Replace with a random secret of at least 32 characters and keep it private.
session_secret = "replace-with-a-random-secret-at-least-32-characters"
# Enable when the browser connects over HTTPS.
session_secure = false

[database]
# Connections and application timestamps always use UTC, overriding conflicting DSN time zones.
# Enable one driver and DSN pair at a time.
# PostgreSQL (default)
driver = "postgres"
dsn = "postgres://agentmesh:password@127.0.0.1:5432/agentmesh?sslmode=disable&timezone=UTC"

# MySQL
# driver = "mysql"
# dsn = "agentmesh:password@tcp(127.0.0.1:3306)/agentmesh?parseTime=true&charset=utf8mb4&loc=UTC&time_zone=%27%2B00%3A00%27"

# SQLite
# driver = "sqlite"
# dsn = "file:agentmesh.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_timezone=UTC"

# SQLite in-memory alternative
# dsn = "file::memory:?_pragma=foreign_keys(1)&_timezone=UTC"
